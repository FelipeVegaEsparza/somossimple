; Configuración de PHP para producción (se carga después de los defaults).
memory_limit = 256M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 120
max_input_vars = 3000
expose_php = Off

; Opcache (código inmutable dentro de la imagen).
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.jit_buffer_size = 64M
opcache.jit = tracing

; Sesiones y logs a stdout/stderr vía Laravel (LOG_CHANNEL=stderr).
realpath_cache_size = 4096k
realpath_cache_ttl = 600
