# Despliegue en Dokploy (tipo Docker Compose, branch main, Compose path:
# docker-compose.prod.yml).
#
# Servicios:
#   web        → nginx + php-fpm (aquí apuntas el dominio, puerto 80)
#   worker     → colas (queue:work)
#   scheduler  → tareas programadas (schedule:run)
#
# Las variables se toman del panel de Dokploy (Environment) mediante
# interpolación ${VAR}. Define ahí: APP_KEY, APP_URL, DB_* y las que necesites.
#
# La base de datos se recomienda como servicio MySQL gestionado por Dokploy
# (mismo proyecto/red que esta app para que resuelva el hostname interno).

x-app-env: &app-env
    APP_NAME: ${APP_NAME:-SomosSimple}
    APP_ENV: ${APP_ENV:-production}
    APP_KEY: ${APP_KEY}
    APP_DEBUG: ${APP_DEBUG:-false}
    APP_URL: ${APP_URL}
    APP_LOCALE: ${APP_LOCALE:-es}
    APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-en}
    APP_TIMEZONE: ${APP_TIMEZONE:-America/Santiago}

    LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
    LOG_LEVEL: ${LOG_LEVEL:-warning}

    DB_CONNECTION: ${DB_CONNECTION:-mysql}
    DB_HOST: ${DB_HOST}
    DB_PORT: ${DB_PORT:-3306}
    DB_DATABASE: ${DB_DATABASE}
    DB_USERNAME: ${DB_USERNAME}
    DB_PASSWORD: ${DB_PASSWORD}

    SESSION_DRIVER: ${SESSION_DRIVER:-database}
    SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
    SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
    SESSION_ENCRYPT: ${SESSION_ENCRYPT:-false}

    BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-log}
    FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}
    QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
    CACHE_STORE: ${CACHE_STORE:-database}

    MAIL_MAILER: ${MAIL_MAILER:-log}
    MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hola@somossimple.cl}
    MAIL_FROM_NAME: ${MAIL_FROM_NAME:-SomosSimple}

    LOYALTY_APPLE_WALLET_ENABLED: ${LOYALTY_APPLE_WALLET_ENABLED:-false}
    LOYALTY_GOOGLE_WALLET_ENABLED: ${LOYALTY_GOOGLE_WALLET_ENABLED:-false}

    TICKETERA_PAYMENT_PROVIDER: ${TICKETERA_PAYMENT_PROVIDER:-manual}
    TICKETERA_WEBPAY_ENABLED: ${TICKETERA_WEBPAY_ENABLED:-false}
    TICKETERA_MERCADOPAGO_ENABLED: ${TICKETERA_MERCADOPAGO_ENABLED:-false}
    TICKETERA_FLOW_ENABLED: ${TICKETERA_FLOW_ENABLED:-false}
    TICKETERA_APPLE_WALLET_ENABLED: ${TICKETERA_APPLE_WALLET_ENABLED:-false}
    TICKETERA_GOOGLE_WALLET_ENABLED: ${TICKETERA_GOOGLE_WALLET_ENABLED:-false}

x-app: &app
    build:
        context: .
        dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
        <<: *app-env
    volumes:
        # Persistencia de subidas (logos, portadas, imágenes de módulos).
        - storage:/var/www/html/storage/app/public

services:
    web:
        <<: *app
        command: ["web"]
        expose:
            - "80"
        # En Dokploy: agrega el dominio apuntando a este servicio, puerto 80.

    worker:
        <<: *app
        command: ["worker"]

    scheduler:
        <<: *app
        command: ["scheduler"]

volumes:
    storage:
